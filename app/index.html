<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#110d0a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>HeroQuest Companion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #110d0a;
      color: #f3e9d2; font: 1.1rem system-ui; }
    #game { position: absolute; top: env(safe-area-inset-top); left: env(safe-area-inset-left);
      right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); overflow: hidden; }
    #startup { padding: 2rem; background: #211b16; }
  </style>
</head>
<body>
  <main id="game"><p id="startup" role="status">HeroQuest wird geladen …</p></main>
  <script>
    const statusText = document.getElementById("startup");
    const english = (localStorage.getItem("language") || navigator.language).startsWith("en");
    document.documentElement.lang = english ? "en" : "de";
    if (english) statusText.textContent = "Loading HeroQuest …";
    // Small Wasm module declaring an empty GC struct.
    const gc = Uint8Array.of(0,97,115,109,1,0,0,0,1,3,1,95,0);
    if (window.WebAssembly && WebAssembly.validate(gc)) {
      const bundle = document.createElement("script");
      bundle.src = "./heroquest.js";
      bundle.onerror = () => { statusText.textContent = english ? "Could not load HeroQuest. Please reload the page." : "Laden fehlgeschlagen. Bitte lade die Seite erneut."; };
      document.head.append(bundle);
    } else {
      statusText.textContent = english ? "HeroQuest requires Safari on iOS 18.2 or later." : "HeroQuest benötigt auf dem iPhone Safari ab iOS 18.2.";
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
